name: carrot-transform.quality
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: run mypy
        run: uv run mypy .
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Run Ruff Checks
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check ."
          version: 0.12.0
      
      - name: Run Ruff Checks
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check --select I ."
          version: 0.12.0

      - name: Run Ruff Checks (without I)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check ."
          version: 0.12.0
      
      - name: Run Ruff Format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check --diff"
          version: 0.12.0

  coverage:
    name: carrot-transform coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # run the coverage check, but, don't worry about coverage of the tests themselves
      - name: Run tests
        # run the coverage check, but, don't worry about coverage of the tests themselves
        # ... or the docker tests ...
        run: |
          uv run coverage run --omit=tests/* -m pytest --junitxml=pytest.xml
          uv run coverage xml

      # adds a comment to the PR detailing code coverage
      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: pytest.xml
        continue-on-error: true
